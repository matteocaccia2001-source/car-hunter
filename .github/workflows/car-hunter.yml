name: Car Hunter

on:
  # Esecuzione pianificata (cron) per quando il Mac è spento.
  schedule:
    - cron: '0 6,12,18,0 * * *'
  workflow_dispatch:                # avvio manuale dal pannello GitHub
    inputs:
      force_subito:
        description: 'Forza esecuzione Subito.it (consuma ~3 credits ScraperAPI)'
        type: boolean
        default: false

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Car Hunter
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          FORCE_SUBITO: ${{ github.event.inputs.force_subito == 'true' && '1' || '0' }}
        run: python execution/main.py
